<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JoLarySync world time zone clock">
  <title>World Clock | JoLarySync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="clock.css">
</head>
<body>
  <header class="clock-header">
    <a href="index.html" class="brand"><img src="assets/jolarysync-logo.svg" alt="JoLarySync logo"></a>
    <a class="back-link" href="index.html">← Back to portfolio</a>
  </header>

  <main class="clock-page">
    <section class="clock-intro">
      <p class="eyebrow">JOLARYSYNC / WORLD CLOCK</p>
      <h1>Keep every time zone<br><em>in sync.</em></h1>
      <p>Quickly check the current time across the locations that matter to your business.</p>
    </section>

    <section class="clock-toolbar" aria-label="Clock settings">
      <label class="toggle-label"><input id="format-toggle" type="checkbox"><span class="switch"></span> 24-hour time</label>
      <p id="live-status" aria-live="polite">Updating every second</p>
    </section>

    <section id="clock-grid" class="clock-grid" aria-label="Current times by time zone"></section>

    <p class="clock-note">Times are calculated from your device clock using the browser's built-in time zone data.</p>
  </main>

  <script src="clock.js"></script>
</body>
</html>
